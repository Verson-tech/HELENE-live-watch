<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hurricane Helene Live Watch</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      async function loadWeather() {
        try {
          const response = await fetch('https://api.openweathermap.org/data/2.5/weather?q=Tampa,FL,US&appid=demo&units=imperial');
          const data = await response.json();
          
          if (data.cod === 200) {
            document.getElementById('weatherDisplay').innerHTML = `
              <div class="weather-info">
                <div class="weather-icon">${getWeatherIcon(data.weather[0].main)}</div>
                <div class="weather-temp">${Math.round(data.main.temp)}°F</div>
                <div class="weather-desc">${data.weather[0].description}</div>
                <div class="weather-location">Tampa, Florida</div>
                <div class="weather-details">
                  <span>Feels like ${Math.round(data.main.feels_like)}°F</span>
                  <span>Humidity ${data.main.humidity}%</span>
                </div>
              </div>
            `;
          } else {
            throw new Error('Weather data unavailable');
          }
        } catch (error) {
          document.getElementById('weatherDisplay').innerHTML = `
            <div class="loading">Loading weather data...</div>
          `;
        }
      }

      function getWeatherIcon(condition) {
        const icons = {
          'Clear': '☀️',
          'Clouds': '☁️',
          'Rain': '🌧️',
          'Thunderstorm': '⛈️',
          'Snow': '❄️',
          'Mist': '🌫️',
          'Fog': '🌫️'
        };
        return icons[condition] || '🌤️';
      }

      loadWeather();
    </script>
    <div class="hero-section">
      <h1 class="hero-title">Track Florida hurricane activity</h1>
      
      <div class="map-container">
        <div class="map-frame">
          <a href="https://www.msn.com/en-us/weather/maps/hurricane/in-Tampa,FL?zoom=6" target="_blank">
            <div class="map-placeholder">
              <div class="map-icon">🌀</div>
              <p>Hurricane Map</p>
              <small>Click to view live tracking</small>
            </div>
          </a>
        </div>

        <div class="map-frame">
          <div class="weather-display" id="weatherDisplay">
            <div class="loading">Loading Florida weather...</div>
          </div>
        </div>
      </div>
    </div>

    <div class="content-section">

  </body>
</html>
